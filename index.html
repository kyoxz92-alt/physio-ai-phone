<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="referrer" content="no-referrer" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#184786" />
    <title>Physio AI</title>
    <link rel="icon" type="image/svg+xml" href="icon.svg" />
    <link rel="stylesheet" href="phone.css" />
  </head>
  <body>
    <header class="top">
      <img class="logo" src="icon.svg" alt="" />
      <span class="name">Physio AI</span>
      <span id="conn" class="conn">Connecting&hellip;</span>
    </header>

    <main id="feed" class="feed">
      <div id="intro" class="intro">
        <p id="site" class="site"></p>
        <div id="cards" class="cards"></div>
      </div>
    </main>

    <div id="unpaired" class="unpaired" hidden>
      <h1>Scan the code on your PC</h1>
      <p>
        Open Physio AI on the hospital PC, tap the phone button in the top bar, and scan the
        QR code with this phone's camera.
      </p>
    </div>

    <footer class="composer">
      <textarea id="input" rows="1" placeholder="Tell the PC what to do&hellip;"></textarea>
      <button id="send" class="round send" aria-label="Send">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7" /></svg>
      </button>
      <button id="stop" class="round stop" aria-label="Stop" hidden>
        <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="6" width="12" height="12" rx="2" fill="currentColor" /></svg>
      </button>
    </footer>

    <script type="module" src="phone.js"></script>
  </body>
</html>
